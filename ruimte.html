    <div class="text-container">
        <h1 data-english="SPACE FOR RECOVERY" data-dutch="RUIMTE VOOR HERSTEL">RUIMTE VOOR HERSTEL</h1>

        <div class="language-toggle">
            <button id="englishBtn">ENGLISH</button>
            <button id="dutchBtn">DUTCH</button>
        </div>

        <p
        data-english=   
        "I have a tendency to stay constantly busy and set the bar high for myself. This often leads to stress and mental   overload. When mentally exhausted, I quickly fall into patterns where self-care is neglected.
         I sleep and eat poorly and seek out distractions, such as social media, that ultimately fail to provide any real satisfaction. The challenge for this project stemmed from the realization that I was placing an unnecessary burden on myself and needed to break free from this vicious cycle.

        Based on this personal reflection, I explored ways to consciously reconnect with ourselves and our surroundings. This insight forms the foundation of the project: the design of a 'space for recovery.' 
        I focused on creating an environment that uses sensory elements to offer an experience, subconsciously encouraging a sense of calm. For instance, I designed a walkway above the pavilion that allows users to choose their own path, and I utilized materials such as rammed earth and locally sourced wood in colors that complement the surrounding landscape.

        The final result is a large-scale landscape pavilion in the Soesterduinen area. It serves as an accessible space for reflection, a refuge from overstimulation, and a place to mentally recharge. I presented the project through a video that conveys the experience, alongside a large-scale model illustrating the site's context.
        " 
        
        data-dutch=
        "Ik heb de neiging om altijd bezig te zijn en de lat hoog te leggen. Dit resulteert vaak in stress en mentale overbelasting. Op momenten van mentale vermoeidheid verval ik snel in patronen waarbij zelfzorg verdwijnt. Ik slaap en eet slecht, ik zoek naar afleidingen, zoals social media, die mij uiteindelijk geen voldoening geven. De uitdaging voor dit project begon bij de realisatie dat ik mezelf onnodig zwaar belast en de behoefte heb om uit deze vicieuze cirkel te stappen.

        Vanuit deze persoonlijke reflectie heb ik onderzocht hoe we weer bewust kunnen stilstaan bij onszelf en onze omgeving. Dit inzicht vormt de basis voor het project: het ontwerpen van een 'ruimte voor herstel'. Ik heb me gericht op het creëren van een omgeving die door middel van zintuigen een ervaring biedt die je onbewust stimuleert om tot rust te komen. Zo heb ik een wandelbrug boven het paviljoen ontworpen waar de gebruiker zijn eigen richting kan kiezen, materialen als stampleem en regionaal hout gebruikt die een complimenterende kleur heeft met de omgeving.

        Het eindresultaat is een grootschalig landschap paviljoen in de Soesterduinen. Het is een toegankelijke ruimte om te reflecteren, prikkels te ontvluchten en mentaal weer op te laden. Ik heb dit project geëxposeerd door middel van een video waarin de ervaring wordt weergegeven. En een grootschalige maquette die de context van de locatie laat zien.
        ">
        </p>
